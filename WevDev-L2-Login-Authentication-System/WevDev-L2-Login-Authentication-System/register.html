<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register - Oasis Infobyte Web Development Internship Task 4">
  <title>Create Account - Oasis Infobyte Authentication System</title>
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'><path d='M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z'/></svg>">
</head>
<body>

  <div class="auth-wrapper">
    <!-- Brand Header -->
    <header class="auth-header">
      <div class="brand-badge">
        <div class="brand-logo-grid" aria-hidden="true">
          <div class="logo-tile tile-orange"></div>
          <div class="logo-tile tile-green"></div>
          <div class="logo-tile tile-blue"></div>
          <div class="logo-tile tile-yellow"></div>
        </div>
        <span class="brand-title">Oasis Infobyte</span>
        <span class="brand-tag">Level 2</span>
      </div>
    </header>

    <!-- Registration Card -->
    <main class="auth-card">
      <div class="auth-card-header">
        <h1 class="auth-card-title">Create Account</h1>
        <p class="auth-card-subtitle">Register your secure credentials with cryptographic salt & SHA-256 hashing.</p>
      </div>

      <!-- Alert / Toast Banner Container -->
      <div id="alert-container" aria-live="polite"></div>

      <!-- Registration Form -->
      <form id="register-form" class="auth-form" novalidate>
        
        <!-- Username Field -->
        <div class="form-group">
          <label for="username" class="form-label">
            <span>Username</span>
            <span class="label-required" aria-hidden="true">*</span>
          </label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input 
              type="text" 
              id="username" 
              name="username" 
              class="form-input" 
              placeholder="e.g. alex_hunter" 
              autocomplete="username"
              required
            >
          </div>
          <div class="error-message" role="alert"></div>
        </div>

        <!-- Email Field -->
        <div class="form-group">
          <label for="email" class="form-label">
            <span>Email Address</span>
            <span class="label-required" aria-hidden="true">*</span>
          </label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="16" x="2" y="4" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </span>
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="form-input" 
              placeholder="e.g. alex@example.com" 
              autocomplete="email"
              required
            >
          </div>
          <div class="error-message" role="alert"></div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password" class="form-label">
            <span>Password</span>
            <span class="label-required" aria-hidden="true">*</span>
          </label>
          <div class="input-wrapper has-toggle">
            <span class="input-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input" 
              placeholder="Minimum 8 characters with at least 1 number" 
              autocomplete="new-password"
              required
            >
            <button 
              type="button" 
              id="toggle-password" 
              class="password-toggle-btn" 
              aria-label="Show password"
              title="Show password"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-eye">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>

          <!-- Password Strength Meter -->
          <div class="password-meter-wrap" aria-live="polite">
            <div class="strength-bar-bg">
              <div id="password-strength-bar" class="strength-bar strength-none"></div>
            </div>
            <div class="strength-info">
              <span id="password-strength-text" class="strength-text"></span>
              <span class="password-hint">Min. 8 chars &bull; At least 1 number</span>
            </div>
          </div>

          <div class="error-message" role="alert"></div>
        </div>

        <!-- Confirm Password Field -->
        <div class="form-group">
          <label for="confirm-password" class="form-label">
            <span>Confirm Password</span>
            <span class="label-required" aria-hidden="true">*</span>
          </label>
          <div class="input-wrapper has-toggle">
            <span class="input-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              </svg>
            </span>
            <input 
              type="password" 
              id="confirm-password" 
              name="confirm-password" 
              class="form-input" 
              placeholder="Re-enter your password" 
              autocomplete="new-password"
              required
            >
            <button 
              type="button" 
              id="toggle-confirm-password" 
              class="password-toggle-btn" 
              aria-label="Show password"
              title="Show password"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-eye">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div class="error-message" role="alert"></div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="register-submit-btn" class="btn-primary">
          <span>Create Account</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="8.5" cy="7" r="4"/>
            <line x1="20" y1="8" x2="20" y2="14"/>
            <line x1="23" y1="11" x2="17" y2="11"/>
          </svg>
        </button>
      </form>

      <!-- Navigation to Login -->
      <footer class="auth-card-footer">
        <p class="auth-footer-text">
          Already registered? 
          <a href="index.html" class="auth-link">Sign in here</a>
        </p>
      </footer>
    </main>

    <!-- Page Footer -->
    <footer class="auth-page-footer">
      <p class="auth-footer-notice">
        <strong>Oasis Infobyte Internship</strong> &bull; Level 2 Task 4: Login Authentication System
      </p>
    </footer>
  </div>

  <!-- JavaScript Modules -->
  <script src="javascript/auth.js"></script>
  <script src="javascript/register.js"></script>
</body>
</html>
