<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign In - Oasis Infobyte Web Development Internship Task 4">
  <title>Sign In - Oasis Infobyte Authentication System</title>
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'><path d='M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z'/></svg>">
</head>
<body>

  <div class="auth-wrapper">
    <!-- Brand Header -->
    <header class="auth-header">
      <div class="brand-badge">
        <div class="brand-logo-grid" aria-hidden="true">
          <div class="logo-tile tile-orange"></div>
          <div class="logo-tile tile-green"></div>
          <div class="logo-tile tile-blue"></div>
          <div class="logo-tile tile-yellow"></div>
        </div>
        <span class="brand-title">Oasis Infobyte</span>
        <span class="brand-tag">Level 2</span>
      </div>
    </header>

    <!-- Authentication Card -->
    <main class="auth-card">
      <div class="auth-card-header">
        <h1 class="auth-card-title">Sign In</h1>
        <p class="auth-card-subtitle">Enter your credentials to access your protected dashboard.</p>
      </div>

      <!-- Alert / Toast Banner Container -->
      <div id="alert-container" aria-live="polite"></div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form" novalidate>
        <!-- Username or Email Field -->
        <div class="form-group">
          <label for="identifier" class="form-label">
            <span>Username or Email</span>
            <span class="label-required" aria-hidden="true">*</span>
          </label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input 
              type="text" 
              id="identifier" 
              name="identifier" 
              class="form-input" 
              placeholder="e.g. john_doe or john@example.com"
              autocomplete="username"
              required
            >
          </div>
          <div class="error-message" role="alert"></div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password" class="form-label">
            <span>Password</span>
            <span class="label-required" aria-hidden="true">*</span>
          </label>
          <div class="input-wrapper has-toggle">
            <span class="input-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input" 
              placeholder="••••••••"
              autocomplete="current-password"
              required
            >
            <button 
              type="button" 
              id="toggle-password" 
              class="password-toggle-btn" 
              aria-label="Show password"
              title="Show password"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-eye">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div class="error-message" role="alert"></div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="login-submit-btn" class="btn-primary">
          <span>Sign In</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <!-- Navigation to Registration -->
      <footer class="auth-card-footer">
        <p class="auth-footer-text">
          Don't have an account? 
          <a href="register.html" class="auth-link">Create one now</a>
        </p>
      </footer>
    </main>

    <!-- Page Footer -->
    <footer class="auth-page-footer">
      <p class="auth-footer-notice">
        <strong>Oasis Infobyte Internship</strong> &bull; Level 2 Task 4: Login Authentication System
      </p>
    </footer>
  </div>

  <!-- JavaScript Modules -->
  <script src="../javascript/auth.js"></script>
  <script src="../javascript/login.js"></script>
</body>
</html>
