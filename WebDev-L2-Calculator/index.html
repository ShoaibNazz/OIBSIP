<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Calculator</title>
  <meta name="description"
    content="A responsive, modern calculator with correct operator precedence, calculation history, copy support, and full keyboard navigation.">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">
    <header class="intro">
      <div class="intro-bar">
        <h1 class="app-title">Smart Calculator</h1>
        <div class="tool-actions">
          <button type="button" id="history-toggle-btn" class="header-tool-btn" aria-label="View calculation history"
            title="Calculation history">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span>History</span>
          </button>
          <button type="button" id="sound-toggle-btn" class="header-tool-btn" aria-label="Toggle sound feedback"
            title="Toggle audio click">
            <svg id="sound-icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <svg id="sound-icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <section class="calculator" aria-label="Calculator">
      <!-- Display Screen -->
      <div class="display">
        <!-- History Overlay Panel -->
        <div id="history-panel" class="history-panel" hidden aria-label="Calculation history panel">
          <div class="history-top">
            <span class="history-title">Recent History</span>
            <button type="button" id="clear-history-btn" class="history-clear-btn"
              aria-label="Clear all history">Clear</button>
          </div>
          <ul id="history-list" class="history-list" aria-live="polite">
            <li class="history-empty">No calculations yet</li>
          </ul>
        </div>

        <div id="expression" class="display__expression" aria-label="Current expression">&nbsp;</div>
        <div class="display__result-row">
          <output id="result" class="display__result" aria-live="polite" aria-atomic="true">0</output>
          <button type="button" id="copy-result-btn" class="btn-copy-result" aria-label="Copy result to clipboard"
            title="Copy result">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Keypad -->
      <div class="keypad" role="group" aria-label="Calculator keys">
        <button type="button" class="key key--fn" data-action="clear" aria-label="Clear all">C</button>
        <button type="button" class="key key--fn" data-action="negate" aria-label="Positive or negative sign">±</button>
        <button type="button" class="key key--fn" data-action="percent" aria-label="Percent">%</button>
        <button type="button" class="key key--op" data-operator="/" aria-label="Divide">÷</button>

        <button type="button" class="key" data-digit="7">7</button>
        <button type="button" class="key" data-digit="8">8</button>
        <button type="button" class="key" data-digit="9">9</button>
        <button type="button" class="key key--op" data-operator="*" aria-label="Multiply">×</button>

        <button type="button" class="key" data-digit="4">4</button>
        <button type="button" class="key" data-digit="5">5</button>
        <button type="button" class="key" data-digit="6">6</button>
        <button type="button" class="key key--op" data-operator="-" aria-label="Subtract">−</button>

        <button type="button" class="key" data-digit="1">1</button>
        <button type="button" class="key" data-digit="2">2</button>
        <button type="button" class="key" data-digit="3">3</button>
        <button type="button" class="key key--op" data-operator="+" aria-label="Add">+</button>

        <button type="button" class="key" data-digit="0">0</button>
        <button type="button" class="key" data-action="decimal" aria-label="Decimal point">.</button>
        <button type="button" class="key key--fn" data-action="backspace" aria-label="Backspace">⌫</button>
        <button type="button" class="key key--equals" data-action="equals" aria-label="Equals">=</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>Visit my github : <a href="https://github.com/ShoaibNazz">GitHub</a>
    </p>
  </footer>

  <script src="script.js" defer></script>
</body>

</html>
